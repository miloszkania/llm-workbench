name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the oldest supported version and the newest one
        python-version: ["3.12", "3.14"]

    steps:
      # clone the repository into the empty runner
      - uses: actions/checkout@v5

      # install the matrix's Python version, with cached pip downloads
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # runs isolated: temporary database, no API key, no network access to OpenRouter
      - name: Smoke test
        run: python scripts/smoke_test.py
