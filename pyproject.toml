[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-workbench"
version = "0.1.0"
description = "Streamlit workbench for running jailbreak experiments on LLMs via OpenRouter, grading responses with LLM-as-a-judge models and exploring the results."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Miłosz Kania" }]
dependencies = [
    "httpx==0.28.1",
    "kaleido==1.4.0",
    "openrouter==1.1.95",
    "pandas==3.0.5",
    "plotly==6.9.0",
    "python-dotenv==1.2.2",
    "streamlit==1.61.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm_workbench"]
